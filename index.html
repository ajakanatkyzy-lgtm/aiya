<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STEM Биология Лабы – командалық ойын</title>
<style>
:root{--bg:#eef7f4;--card:#ffffff;--tx:#10302a;--mut:#58766f;--pri:#0f8b7d;--pri2:#0a5f56;--acc:#ffb703;--bad:#e5484d;--ok:#1f9d55;--bd:#cfe3dd;--S:#1f9d55;--T:#2f6fe4;--E:#f08a1c;--M:#8a4fd8;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1715;--card:#13262310;--card:#12241f;--tx:#e6f4f0;--mut:#8fb0a8;--bd:#25423b;--pri:#22b8a6;--pri2:#5fd6c8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1715;--card:#12241f;--tx:#e6f4f0;--mut:#8fb0a8;--bd:#25423b;--pri:#22b8a6;--pri2:#5fd6c8;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
#app{max-width:880px;margin:0 auto;padding:14px}
h1{font-size:clamp(28px,6vw,46px);margin:.2em 0;line-height:1.1}
h2{font-size:clamp(20px,3.6vw,27px);margin:.5em 0;line-height:1.3}
.hero{text-align:center;padding:26px 10px}
.logo{font-size:64px;animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px) rotate(6deg)}}
.sub{color:var(--mut);font-size:17px;margin:.3em 0 1.2em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;box-shadow:0 6px 24px rgba(15,139,125,.10);margin:10px 0}
button{font:inherit;cursor:pointer;border:0;border-radius:12px}
.go{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;padding:13px 26px;font-weight:700;font-size:18px;margin-top:12px;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.go:active{transform:translateY(2px)}
.ghost{background:transparent;border:2px solid var(--bd);color:var(--tx);padding:10px 16px;margin:4px}
.cnt button{width:46px;height:46px;font-size:20px;font-weight:700;background:var(--bg);border:2px solid var(--bd);color:var(--tx);margin:4px}
.cnt button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.names{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin-top:10px}
.names input{font:inherit;padding:10px 12px;border-radius:10px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);width:100%}
.board{display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:6px 0;background:var(--bg)}
.chip{flex:1;min-width:92px;background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:6px 10px;text-align:center;transition:.2s}
.chip b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip span{font-size:22px;font-weight:800;color:var(--pri)}
.chip.cur{border-color:var(--acc);transform:scale(1.05);box-shadow:0 0 0 3px rgba(255,183,3,.35)}
.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--mut);font-size:14px}
.cat{color:#fff;border-radius:20px;padding:3px 12px;font-weight:700}
.cat.S{background:var(--S)}.cat.T{background:var(--T)}.cat.E{background:var(--E)}.cat.M{background:var(--M)}
.st{color:var(--E);font-weight:700}
.who{margin-top:8px;font-size:18px}
.tb{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:10px 0}
.tb i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--ok),var(--acc),var(--bad));background-size:300% 100%;transition:width .1s linear}
.hint{color:var(--mut);margin:0 0 6px}
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:14px 16px;background:var(--bg);border:2px solid var(--bd);color:var(--tx);font-size:17px;transition:.15s}
.opt:hover{border-color:var(--pri);transform:translateX(3px)}
.opt.sel{border-color:var(--pri);background:rgba(15,139,125,.15)}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{background:var(--bad);border-color:var(--bad);color:#fff;animation:sh .35s}
@keyframes sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--bg);border-left:6px solid var(--pri);font-size:16px}
.fb.good{border-color:var(--ok)}.fb.no{border-color:var(--bad)}
.pts{font-size:26px;font-weight:800;color:var(--ok)}
.task h2{display:flex;gap:10px;align-items:center}
.task ol,.task ul{margin:6px 0;padding-left:22px}.task li{margin:4px 0}
.roll{font-size:28px;text-align:center;padding:30px 10px;font-weight:800;min-height:100px}
.judge{display:flex;gap:8px;flex-wrap:wrap}
.judge button{flex:1;min-width:64px;padding:12px;background:var(--acc);color:#2b1d00;font-weight:800;font-size:18px}
.tm{font-size:34px;font-weight:800;text-align:center;color:var(--pri)}
.podium div{display:flex;gap:12px;align-items:center;padding:12px 14px;margin:8px 0;border-radius:14px;background:var(--card);border:2px solid var(--bd);font-size:20px;animation:up .5s both}
.podium div:first-child{border-color:var(--acc);font-size:26px;font-weight:800}
.podium em{margin-left:auto;font-style:normal;font-weight:800;color:var(--pri)}
@keyframes up{from{opacity:0;transform:translateY(20px)}}
canvas{position:fixed;inset:0;pointer-events:none;z-index:50}
.row{display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>
<div id="app"></div>
<canvas id="cf"></canvas>
<script>
var CN={S:"S – Ғылым",T:"T – Технология",E:"E – Инженерия",M:"M – Математика"};
var Q=[
{c:"S",q:"STEM аббревиатурасындағы әріптер нені білдіреді?",o:["Science, Technology, Engineering, Mathematics","Biology, Chemistry, Physics, Geography","Study, Test, Experiment, Model","Science, Teaching, Education, Method"],a:[0],e:"STEM – ғылым, технология, инженерия және математиканы біріктіретін тәсіл."},
{c:"S",q:"Гидропоника дегеніміз не?",o:["Өсімдікті топырақсыз, қоректік ерітіндіде өсіру","Өсімдікті тек түнде суару","Өсімдікті толығымен су астында өсіру","Топыраққа тыңайтқышты көп қосу"],a:[0],e:"Гидропоникада тамыр қоректік заттарды суда еріген күйде алады."},
{c:"E",q:"Гидропоника моделінде ерітіндіні ауамен қанықтыру (аэрация) не үшін қажет?",o:["Тамыр тыныс алуы үшін оттегі жеткілікті болсын деп","Ерітінді қызыл түске боялсын деп","Жапырақ тез түссін деп","Су буланбасын деп"],a:[0],e:"Тамырлар да тыныс алады, оттегі жетпесе өсімдік әлсірейді."},
{c:"S",q:"Жабық микроэкожүйе (бөтелкедегі экожүйе) тұрақты жұмыс істеуі үшін не қажет?",o:["Жарық көзі","Өсімдіктер – продуценттер","Микроорганизмдер – редуценттер","Күн сайын жаңа тамақ салып тұру"],a:[0,1,2],e:"Энергия жарықтан келеді, заттар продуцент пен редуцент арқылы айналымда жүреді."},
{c:"M",q:"ДНҚ моделін жасағанда аденин (А) қай азотты негізбен жұптасады?",o:["Тимин (Т)","Гуанин (Г)","Цитозин (Ц)","Урацил (У)"],a:[0],e:"Комплементарлылық ережесі: А–Т және Г–Ц."},
{c:"M",q:"Г–Ц жұбында нешеден сутектік байланыс болады?",o:["2","3","4","1"],a:[1],e:"А–Т жұбында 2, Г–Ц жұбында 3 сутектік байланыс бар."},
{c:"S",q:"ДНҚ құрылымының қандай үлгісін Уотсон мен Крик ұсынды (1953 ж.)?",o:["Қос спираль","Бір тізбекті сызық","Тұйық шеңбер","Үшбұрышты тор"],a:[0],e:"ДНҚ – бір-біріне комплементарлы екі тізбектен тұратын қос спираль."},
{c:"E",q:"Инженерлік дизайн циклының дұрыс реті қайсы?",o:["Мәселені анықта → идея ұсын → модель жаса → сына → жақсарт","Модель жаса → мәселені анықта → жақсарт → сына","Сына → идея ұсын → мәселені анықта → модель жаса","Идея ұсын → жақсарт → сына → мәселені анықта"],a:[0],e:"Инженер алдымен мәселені анықтайды, соңында нәтижені жақсартады."},
{c:"S",q:"Экспериментте бақылау (контроль) тобы не үшін қажет?",o:["Нәтижені зерттелетін фактордың әсері жоқ жағдаймен салыстыру үшін","Эксперимент әдемі көрінуі үшін","Қате жібермеу үшін ғана","Өсімдік санын көбейту үшін"],a:[0],e:"Салыстыру болмаса, өзгерістің себебін дәлелдеу мүмкін емес."},
{c:"M",q:"5 л ерітіндіге 15 г тыңайтқыш қосылады. Сол концентрациямен 2 л ерітіндіге қанша керек?",o:["3 г","6 г","7,5 г","10 г"],a:[1],e:"15 : 5 = 3 г/л, сонда 3 · 2 = 6 г."},
{c:"T",q:"Топырақ ылғалдылығын автоматты бақылау үшін қандай құрал қолданылады?",o:["Ылғал датчигі (мысалы, Arduino-мен)","Қарапайым сызғыш","Үлкейткіш шыны","Компас"],a:[0],e:"Датчик деректерді санға айналдырады, оны график пен есепке қолдануға болады."},
{c:"E",q:"Қай тұжырым ҚАТЕ? (сыни ойлау)",o:["рН өлшемей-ақ ерітіндіні кез келген қышқылдықта қолдана беруге болады","Өсу нәтижесін кесте мен графикке түсірген тиімді","Бір факторды өзгертіп, қалғанын тұрақты ұстау керек","Модельді сынап, қателерін түзету керек"],a:[0],e:"рН қоректік заттардың сіңірілуіне әсер етеді, сондықтан оны бақылау керек."},
{c:"T",q:"Қай тапсырма STEM талаптарына толық сай келеді?",o:["Гидропоника моделін жасап, өсуін өлшеп, графикпен талдау","Параграфты жаттап айту","Өсімдік суретін көшіріп салу","Терминдер тізімін жазу"],a:[0],e:"Мұнда зерттеу (S), құрал (T), жасау (E) және өлшеу/график (M) бар."}
];
var TASKS=[
{i:"💧",n:"Гидропоника моделі",g:"Топырақсыз өсіру моделін құрастырып, оның жұмысын дәлелдеңдер.",s:["Ыдыс пен қоректік ерітіндіні таңдаңдар","Тамырға оттегі беру жолын (аэрация) ойластырыңдар","Қандай көрсеткішті өлшейсіңдер: рН, биіктік, күн саны?"]},
{i:"🌍",n:"Микроэкожүйе",g:"Жабық бөтелкеде өздігінен жұмыс істейтін шағын экожүйе жобалаңдар.",s:["Қабаттарды жоспарлаңдар: дренаж, топырақ, өсімдік","Продуцент, консумент, редуцентті көрсетіңдер","Жарық пен су тепе-теңдігін түсіндіріңдер"]},
{i:"🧬",n:"ДНҚ моделі",g:"Қолда бар материалдан ДНҚ қос спиральдың моделін жасаңдар.",s:["Материал таңдаңдар: бисер, сым, пластилин, кәмпит","Негіздерді түспен белгілеңдер: А–Т, Г–Ц","Спиральдың бұралуын және байланыс санын көрсетіңдер"]}
];
var CRIT=["S – ғылыми негіздеме дұрыс","T – технология/құрал қолданылды","E – инженерлік шешім бар","M – өлшем немесе есеп бар"];
var app=document.getElementById("app"),S={};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function beep(f,d){try{var a=beep.a||(beep.a=new(window.AudioContext||window.webkitAudioContext)()),o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.value=.06;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}
function good(){beep(660,.15);setTimeout(function(){beep(880,.25)},150)}
function bad(){beep(180,.4)}
function $(id){return document.getElementById(id)}

/* ---------- setup ---------- */
var N=5,NAMES=[];
function setup(){
 clearInterval(S.tm);
 var names="";for(var i=0;i<N;i++)names+='<input maxlength="22" id="n'+i+'" value="'+esc(NAMES[i]||(i+1)+"-топ")+'">';
 var cnt="";for(var k=2;k<=6;k++)cnt+='<button class="'+(k===N?"on":"")+'" data-k="'+k+'">'+k+'</button>';
 app.innerHTML='<div class="hero"><div class="logo">🧬</div><h1>STEM Биология Лабы</h1><p class="sub">Биологиялық STEM-тапсырмалар: гидропоника, микроэкожүйе, ДНҚ моделі.<br>Командалық жарыс · 13 сұрақ · ұрлау · финалдағы жоба-челлендж</p></div>'+
 '<div class="card"><h2>Қанша топ ойнайды?</h2><div class="cnt">'+cnt+'</div><div class="names">'+names+'</div>'+
 '<p class="hint">Ереже: дұрыс жауап – 10 ұпай + жылдамдық бонусы (+5). Қателессе, келесі топ «ұрлап» жартылай ұпай ала алады (5). Финалда әр топ жоба-тапсырма алып, жюри 0–10 ұпай береді.</p>'+
 '<button class="go" id="start">🚀 Ойынды бастау</button></div>';
 [].forEach.call(app.querySelectorAll(".cnt button"),function(b){b.onclick=function(){saveNames();N=+b.dataset.k;setup()}});
 $("start").onclick=function(){saveNames();begin()};
}
function saveNames(){NAMES=[];for(var i=0;i<N;i++){var e=$("n"+i);NAMES.push(e&&e.value.trim()?e.value.trim():(i+1)+"-топ")}}
function begin(){
 var n=N;S={T:NAMES.slice(0,n).map(function(x){return{n:x,s:0}}),qs:shuf(Q).slice(0,Math.min(Q.length,n*2)),qi:0,used:[]};
 beep(520,.1);qView();
}
function board(){return '<div class="board">'+S.T.map(function(t,i){return '<div class="chip '+(i===S.cur?"cur":"")+'"><b>'+esc(t.n)+'</b><span>'+t.s+'</span></div>'}).join("")+'</div>'}

/* ---------- questions ---------- */
function qView(steal){
 var q=S.qs[S.qi],n=S.T.length;
 S.steal=!!steal;
 if(!steal)S.owner=S.qi%n;
 S.cur=steal?(S.owner+1)%n:S.owner;
 S.opts=shuf(q.o.map(function(t,i){return{t:t,ok:q.a.indexOf(i)>-1}}));
 S.sel=[];S.done=false;S.max=steal?20:30;S.left=S.max;
 var multi=q.a.length>1;
 app.innerHTML=board()+'<div class="card"><div class="meta"><span class="cat '+q.c+'">'+CN[q.c]+'</span><span>Сұрақ '+(S.qi+1)+' / '+S.qs.length+'</span>'+(steal?'<span class="st">⚡ Ұрлау: 5 ұпай</span>':'')+'</div>'+
 '<div class="who">Жауап береді: <b>'+esc(S.T[S.cur].n)+'</b></div><div class="tb"><i id="tf"></i></div><h2>'+esc(q.q)+'</h2>'+(multi?'<p class="hint">Бірнеше жауапты таңдаңыздар</p>':'')+
 '<div class="opts">'+S.opts.map(function(o,i){return '<button class="opt" data-i="'+i+'">'+esc(o.t)+'</button>'}).join("")+'</div>'+(multi?'<button class="go" id="sub">Жауап беру</button>':'')+'<div id="fb"></div></div>';
 [].forEach.call(app.querySelectorAll(".opt"),function(b){b.onclick=function(){
  if(S.done)return;var i=+b.dataset.i;
  if(!multi){S.sel=[i];finish();return}
  var p=S.sel.indexOf(i);if(p>-1)S.sel.splice(p,1);else S.sel.push(i);b.classList.toggle("sel")}});
 if(multi)$("sub").onclick=function(){if(!S.done)finish()};
 clearInterval(S.tm);
 S.tm=setInterval(function(){
  S.left-=.1;var f=$("tf");if(f)f.style.width=Math.max(0,S.left/S.max*100)+"%";
  if(S.left<=0){clearInterval(S.tm);if(!S.done)finish(true)}},100);
}
function finish(timeout){
 clearInterval(S.tm);S.done=true;
 var q=S.qs[S.qi],ok=true;
 S.opts.forEach(function(o,i){if(o.ok!==(S.sel.indexOf(i)>-1))ok=false});
 if(timeout)ok=false;
 [].forEach.call(app.querySelectorAll(".opt"),function(b,i){b.classList.remove("sel");if(S.opts[i].ok)b.classList.add("ok");else if(S.sel.indexOf(i)>-1)b.classList.add("bad")});
 var h="",n=S.T.length;
 if(ok){
  var pts=S.steal?5:10+(S.left>=S.max*.66?5:S.left>=S.max*.33?2:0);
  S.T[S.cur].s+=pts;good();
  h='<div class="fb good"><div class="pts">+'+pts+' ұпай! 🎉</div>'+esc(q.e)+'</div><button class="go" id="nx">Келесі ▶</button>';
  if(pts>=15)confetti(60);
 }else{
  bad();
  h='<div class="fb no"><b>'+(timeout?"Уақыт бітті ⏰":"Қате жауап")+'.</b> '+esc(q.e)+'</div>';
  if(!S.steal&&n>1)h+='<button class="go" id="st">⚡ '+esc(S.T[(S.owner+1)%n].n)+' ұрлап көреді</button> <button class="ghost" id="nx">Өткізу</button>';
  else h+='<button class="go" id="nx">Келесі ▶</button>';
 }
 $("fb").innerHTML=h;
 var board0=document.querySelector(".board");if(board0)board0.outerHTML=board();
 if($("nx"))$("nx").onclick=nextQ;
 if($("st"))$("st").onclick=function(){qView(true)};
 $("fb").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function nextQ(){S.qi++;if(S.qi>=S.qs.length){S.fi=0;fView()}else qView()}

/* ---------- final project challenge ---------- */
function fView(){
 clearInterval(S.tm);S.cur=S.fi;
 app.innerHTML=board()+'<div class="card"><div class="meta"><span class="cat E">🏁 Финал: жоба-челлендж</span><span>'+(S.fi+1)+' / '+S.T.length+'</span></div>'+
 '<h2>'+esc(S.T[S.fi].n)+', тапсырма таңдайық!</h2><div class="roll" id="roll">🎡</div><div class="row" style="justify-content:center"><button class="go" id="spin">🎲 Айналдыру</button></div></div>';
 $("spin").onclick=spin;
}
function spin(){
 var pool=TASKS.filter(function(t){return S.used.indexOf(t.n)<0});if(!pool.length)pool=TASKS;
 var pick=pool[Math.floor(Math.random()*pool.length)],k=0;
 $("spin").disabled=true;
 var iv=setInterval(function(){var t=TASKS[k++%3];$("roll").textContent=t.i+" "+t.n;beep(300+k*25,.05);
  if(k>16){clearInterval(iv);S.used.push(pick.n);task(pick);good()}},90+0);
}
function task(t){
 S.cl=90;
 app.innerHTML=board()+'<div class="card task"><div class="meta"><span class="cat E">🏁 Финал</span><span>'+esc(S.T[S.fi].n)+'</span></div><h2><span style="font-size:42px">'+t.i+'</span>'+esc(t.n)+'</h2><p><b>Мақсат:</b> '+esc(t.g)+'</p>'+
 '<b>Жоспар құрыңдар:</b><ol>'+t.s.map(function(x){return '<li>'+esc(x)+'</li>'}).join("")+'</ol><b>Жюри критерийлері:</b><ul>'+CRIT.map(function(x){return '<li>'+esc(x)+'</li>'}).join("")+'</ul>'+
 '<div class="tm" id="tm">1:30</div><div class="row" style="justify-content:center"><button class="go" id="tgo">▶ Ойлануды бастау (90 с)</button></div>'+
 '<div id="jd" style="display:none"><h2>Жюри бағасы</h2><div class="judge">'+[0,4,7,10].map(function(p){return '<button data-p="'+p+'">'+p+'</button>'}).join("")+'</div></div></div>';
 $("tgo").onclick=function(){
  $("tgo").disabled=true;clearInterval(S.tm);
  S.tm=setInterval(function(){S.cl--;var m=Math.floor(S.cl/60),s=S.cl%60;$("tm").textContent=m+":"+(s<10?"0":"")+s;
   if(S.cl<=10&&S.cl>0)beep(500,.05);if(S.cl<=0){clearInterval(S.tm);bad();$("jd").style.display="block"}},1000);
  $("jd").style.display="block"};
 [].forEach.call(app.querySelectorAll(".judge button"),function(b){b.onclick=function(){
  clearInterval(S.tm);S.T[S.fi].s+=+b.dataset.p;S.fi++;if(+b.dataset.p>=7)confetti(50);
  if(S.fi>=S.T.length)result();else fView()}});
}

/* ---------- result ---------- */
function result(){
 var r=S.T.slice().sort(function(a,b){return b.s-a.s}),m=["🥇","🥈","🥉"];
 app.innerHTML='<div class="hero"><div class="logo">🏆</div><h1>'+esc(r[0].n)+' жеңді!</h1><p class="sub">Барлық топтарға рахмет – сіздер нағыз STEM-зерттеушілерсіздер!</p></div><div class="podium">'+
 r.map(function(t,i){return '<div style="animation-delay:'+i*.15+'s"><span>'+(m[i]||(i+1)+".")+'</span>'+esc(t.n)+'<em>'+t.s+' ұпай</em></div>'}).join("")+'</div>'+
 '<div class="row" style="justify-content:center"><button class="go" id="again">🔄 Қайта ойнау</button></div>';
 $("again").onclick=setup;good();confetti(220);
}

/* ---------- confetti ---------- */
function confetti(n){
 var c=$("cf"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
 var cols=["#0f8b7d","#ffb703","#e5484d","#2f6fe4","#8a4fd8","#1f9d55"],p=[];
 for(var i=0;i<n;i++)p.push({x:Math.random()*c.width,y:-20-Math.random()*c.height*.4,vx:Math.random()*4-2,vy:2+Math.random()*4,s:5+Math.random()*7,c:cols[i%6],r:Math.random()*6});
 (function f(){x.clearRect(0,0,c.width,c.height);var alive=0;
  p.forEach(function(q){q.x+=q.vx;q.y+=q.vy;q.r+=.15;if(q.y<c.height+20){alive++;x.save();x.translate(q.x,q.y);x.rotate(q.r);x.fillStyle=q.c;x.fillRect(-q.s/2,-q.s/2,q.s,q.s*.6);x.restore()}});
  if(alive)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})();
}
setup();
</script>
